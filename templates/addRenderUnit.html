<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Render Time Estimator</title>
    <link rel="stylesheet" href="/static/styles/addRenderUnit_style.css">
  </head>
  <body>
    <div class="space">
      <div class="container">
        <div class="add-container">
          <form class="add-form">
            <div class="form-section">
              <div class="form-group">
                <label for="image">Изображение</label>
                <input type="file" id="image" name="image" accept="image/*" />
              </div>
              <div class="form-group">
                <label for="video">Видео</label>
                <input type="file" id="video" name="video" accept="video/*" />
              </div>
            </div>

            <div class="form-section">
              <div class="form-group">
                <label for="gpu">CPU/GPU</label>
                <input type="text" id="gpu" name="gpu" placeholder="Например: RTX 4090" />
              </div>
              <div class="form-group">
                <label for="ram">Объём RAM (ГБ)</label>
                <input type="text" id="ram" name="ram" placeholder="Например: 32" />
              </div>
              <div class="form-group">
                <label for="description">Описание</label>
                <textarea id="description" name="description" rows="4" placeholder="Краткое описание"></textarea>
              </div>
            </div>

            <button type="submit" class="submit-btn">Добавить</button>
          </form>
        </div>
      </div>

      <div class="nav">
        <ul class="nav-list">
          <li>
            <a href="/RenderUnits/1">
              <img src="/static/img/home.png" alt="Лента" />
            </a>
          </li>
          <li class="active">
            <a href="/AddRenderUnit">
              <img src="/static/img/add.png" alt="Добавление" />
            </a>
          </li>
          <li>
            <a href="/RenderUnits">
              <img src="/static/img/grid.png" alt="Плитка" />
            </a>
          </li>
        </ul>
      </div>
    </div>
  </body>
</html>
