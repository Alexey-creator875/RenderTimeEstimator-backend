<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Render Time Estimator</title>
    <link rel="stylesheet" href="/static/styles/addRenderServerUnit_style.css">
  </head>
  <body>
    <div class="space">
      <div class="container">
        <div class="add-container">

          {{ if .hasDraft }}

          <form class="add-form" action="/PublishRenderServerUnit" method="POST">
            <div class="form-section media-section">
              <div class="media-upload">
                <div class="media-label">
                  <img src="/static/img/image-placeholder.png" alt="Изображение по умолчанию" />
                </div>
                <p class="media-caption">Изображение</p>
              </div>

              <div class="media-upload">
                <div class="media-label">
                  <img src="/static/img/image-placeholder.png" alt="Видео по умолчанию" />
                </div>
                <p class="media-caption">Видео</p>
              </div>
            </div>

            <div class="form-section">
              <div class="form-group">
                <label for="processor">Процессор</label>
                <input type="text" id="processor" name="processor"
                      value="{{ .renderServerUnit.Processor }}" readonly />
              </div>

              <div class="form-group">
                <label for="cores">Количество ядер</label>
                <input type="text" id="cores" name="cores"
                      placeholder="Например: 20" />
              </div>
              <div class="form-group">
                <label for="ram">Объём RAM (ГБ)</label>
                <input type="text" id="ram" name="ram"
                      placeholder="Например: 32" />
              </div>
              <div class="form-group">
                <label for="description">Описание</label>
                <textarea id="description" name="description" rows="4"
                          placeholder="Краткое описание"></textarea>
              </div>
            </div>

            <button type="submit" class="submit-btn">Опубликовать</button>
          </form>

          {{ else }}
          <form class="add-form" action="/AddRenderServerUnit" method="POST">
            <div class="form-section media-section">
              <div class="media-upload">
                <label for="image" class="media-label">
                  <img id="image-preview" src="/static/img/image-placeholder.png" alt="Превью изображения" />
                </label>
                <input type="file" id="image" name="image" accept="image/*" hidden />
                <p class="media-caption">Изображение</p>
              </div>

              <div class="media-upload">
                <label for="video" class="media-label">
                  <video id="video-preview" muted playsinline style="display: none;"></video>
                  <img id="video-placeholder" src="/static/img/image-placeholder.png" alt="Превью видео" />
                </label>
                <input type="file" id="video" name="video" accept="video/*" hidden />
                <p class="media-caption">Видео</p>
              </div>
            </div>

            <div class="form-section">
              <div class="form-group">
                <label for="processor">Процессор</label>
                <input type="text" id="processor" name="processor"
                      placeholder="Например: RTX 4090" required />
              </div>
            </div>

            <button type="submit" class="submit-btn">Далее</button>
          </form>

          {{ end }}

          </form>
        </div>
      </div>

      <div class="nav">
        <ul class="nav-list">
          <li>
            <a href="/RenderServerUnits/1">
              <img src="/static/img/home.png" alt="Лента" />
            </a>
          </li>
          <li class="active">
            <a href="/AddRenderServerUnit">
              <img src="/static/img/add.png" alt="Добавление" />
            </a>
          </li>
          <li>
            <a href="/RenderServerUnits">
              <img src="/static/img/grid.png" alt="Плитка" />
            </a>
          </li>
        </ul>
      </div>
    </div>

    <script>
      // ===== Изображение =====
      const imageInput = document.getElementById('image');
      const imagePreview = document.getElementById('image-preview');

      imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        // Отзываем предыдущий URL, если он был (чтобы не копить память)
        if (imagePreview.dataset.objectUrl) {
          URL.revokeObjectURL(imagePreview.dataset.objectUrl);
        }
        const url = URL.createObjectURL(file);
        imagePreview.src = url;
        imagePreview.dataset.objectUrl = url;
      });

      // ===== Видео =====
      const videoInput = document.getElementById('video');
      const videoPreview = document.getElementById('video-preview');
      const videoPlaceholder = document.getElementById('video-placeholder');

      videoInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (videoPreview.dataset.objectUrl) {
          URL.revokeObjectURL(videoPreview.dataset.objectUrl);
        }
        const url = URL.createObjectURL(file);
        videoPreview.src = url;
        videoPreview.dataset.objectUrl = url;

        // Меняем заглушку на плеер
        videoPreview.style.display = 'block';
        videoPlaceholder.style.display = 'none';
      });
    </script>
  </body>
</html>
