<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Render Time Estimator</title>
    <link rel="stylesheet" href="/static/styles/renderUnits_style.css">
  </head>
  <body>
    <div class="space">
      <div class="container">
        <form action="/RenderUnits" method="GET">
          <input type="text" name="query" placeholder="Введите запрос" value="{{ .query }}">
          <button type="submit">Найти</button>
        </form>
        
        <ul class="cards-list">
          {{ range .renderUnits }}
          <li class="card">
            <img src="http://localhost:9000/render-assets/{{ .ImagePath }}" class="image">
            <p class="title">{{ .Title }}</p>
            <div class="short-description">
              <p>{{ .GPU }}</p>
              <p>{{ .RAM }}</p>
              <p>{{ .Storage }}</p>
            </div>
            <a href="/RenderUnits/{{ .ID }}" class="card-button">Подробнее</a> 
          </li>
          {{ end }}
        </ul>
      </div>

      <div class="nav">
        <ul class="nav-list">
          <li class="nav-item">
            <a class="label" href="/RenderUnits/1">Лента</a>
          </li>
          <li class="nav-item">
            <a class="label" href="">Добавление</a>
          </li>
          <li class="nav-item">
            <a class="label" href="/RenderUnits">Плитка</a>
          </li>
        </ul>
      </div>
    </div>
  </body>
</html>
