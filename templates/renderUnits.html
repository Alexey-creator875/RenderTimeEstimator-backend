<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Render Time Estimator</title>
    <link rel="stylesheet" href="/static/styles/renderUnits_style.css">
  </head>
  <body>
    <div class="space">
      <div class="container">
        <div class="grid-container">
          <form action="/RenderUnits" method="GET">
            <input type="text" name="query" placeholder="Введите объём памяти" value="{{ .query }}">
            <button type="submit">Найти</button>
          </form>
          
          <ul class="cards-list">
            {{ range .renderUnits }}
            <li class="card">
              <img src="http://localhost:9000/render-assets/{{ .ImagePath }}" alt="4090" class="card-image" />

              <div class="card-body">
                <h3 class="card-title">{{ .Processor }}</h3>
                <p class="card-specs">Количество Ядер: {{ .Cores }} шт.</p>
                <p class="card-specs">Объём RAM: {{ .RAM }} ГБ</p>

                <div class="card-footer">
                  <div class="card-likes">
                    <img src="/static/img/blue-like.png" alt="Лайк" class="like-icon" />
                    <span class="likes-count">{{ .Likes }}</span>
                  </div>
                  <a href="/RenderUnits/{{ .ID }}" class="card-btn">Выбрать</a>
                </div>
              </div>


              <!-- <img src="http://localhost:9000/render-assets/{{ .ImagePath }}" class="image">
              <div class="short-description">
                <p class="title">{{ .Processor }}</p>
                <p>{{ .Cores }}</p>
                <p>{{ .RAM }}</p>
              </div>
              <div class="likes">
                <img src="/static/img/blue-like.png" alt="лайк">
                <span>{{ .Likes }}</span>
              </div>
              <a href="/RenderUnits/{{ .ID }}" class="card-button">Подробнее</a>  -->
            </li>
            {{ end }}
          </ul>
        </div>
      </div>

      <div class="nav">
        <ul class="nav-list">
          <li>
            <a href="/RenderUnits/1">
              <img src="/static/img/home.png" alt="Лента" />
            </a>
          </li>
          <li>
            <a href="/AddRenderUnit">
              <img src="/static/img/add.png" alt="Добавление" />
            </a>
          </li>
          <li class="active">
            <a href="/RenderUnits">
              <img src="/static/img/grid.png" alt="Плитка" />
            </a>
          </li>
        </ul>
      </div>
    </div>
  </body>
</html>
