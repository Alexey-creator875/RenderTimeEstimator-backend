<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Render Time Estimator</title>
    <link rel="stylesheet" href="/static/styles/video_style.css">
  </head>
  <body>
    <div class="space">
      <div class="container">
        <div class="video-container">
          <div class="video-wrapper">
            <video src="http://localhost:9000/render-assets/{{ .renderServerUnit.VideoPath }}" autoplay muted loop playsinline></video>
          </div>

          <div class="overlay">
            <div class="overlay-left">
              <p class="title">{{ .renderServerUnit.Processor }}</p>

              <div class="description-block">
                <p class="description">{{ .renderServerUnit.Description }}</p>
                <span class="desc-toggle">ЕЩЁ</span>
              </div>
            </div>

            <ul class="overlay-right">
              <li class="overlay-item">
                <img src="/static/img/like.png" alt="Лайк" class="icon like-icon" />
                <p class="item-value">{{ .renderServerUnit.Likes }}</p>
              </li>

              <li class="overlay-item">
                <img src="/static/img/cores.png" alt="Ядра" class="icon cores-icon" />
                <p class="item-value">{{ .renderServerUnit.Cores }}</p>
              </li>

              <li class="overlay-item">
                <img src="/static/img/RAM.png" alt="Память" class="icon memory-icon" />
                <p class="item-value">{{ .renderServerUnit.RAM }}</p>
              </li>

              <li class="overlay-item">
                <a href="/RenderServerUnits/{{ .renderServerUnit.ID }}?next=true">
                  <img src="/static/img/next.png" alt="Следующее" class="icon next-icon" />
                </a>
              </li>
            </ul>
          </div>
        </div>
      </div>

      <div class="nav">
        <ul class="nav-list">
          <li class="active">
            <a href="/RenderServerUnits/1">
              <img src="/static/img/home.png" alt="Лента" />
            </a>
          </li>
          <li>
            <a href="/AddRenderServerUnit">
              <img src="/static/img/add.png" alt="Добавление" />
            </a>
          </li>
          <li>
            <a href="/RenderServerUnits">
              <img src="/static/img/grid.png" alt="Плитка" />
            </a>
          </li>
        </ul>
      </div>
    </div>

    <script>
      document.querySelectorAll('.description-block').forEach(block => {
        const desc = block.querySelector('.description');
        const toggle = block.querySelector('.desc-toggle');

        // Проверяем, обрезан ли текст. Если нет — прячем тумблер
        if (desc.scrollHeight <= desc.clientHeight) {
          toggle.style.display = 'none';
          return;
        }

        toggle.addEventListener('click', () => {
          block.classList.toggle('expanded');
          toggle.textContent = block.classList.contains('expanded') ? 'СВЕРНУТЬ' : 'ЕЩЁ';
        });
      });
    </script>
  
  </body>
</html>
