<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Render Time Estimator</title>
    <link rel="stylesheet" href="/static/styles/renderServerUnits_style.css">
  </head>
  <body>
    <div class="space">
      <div class="container">
        <div class="grid-container">

          <form class="filter-form" action="/RenderUnits" method="GET">
            <!-- Подпись с текущими значениями -->
            <div class="range-label">
              Объём памяти: <span id="min-output">8</span> – <span id="max-output">128</span> ГБ
            </div>

            <!-- Ряд: слайдер + кнопка -->
            <div class="filter-row">
              <div class="range-slider">
                <input type="range" name="min" id="range-min"
                      min="8" max="128" step="1" value="8"
                      class="range-input range-min" />
                <input type="range" name="max" id="range-max"
                      min="8" max="128" step="1" value="128"
                      class="range-input range-max" />
              </div>

              <button type="submit" class="filter-btn">Применить</button>
            </div>
          </form>
          
          <ul class="cards-list">
            {{ range .renderServerUnits }}
            <li class="card">
              <img src="http://localhost:9000/render-assets/{{ .ImagePath }}" alt="4090" class="card-image" />

              <div class="card-body">
                <h3 class="card-title">{{ .Processor }}</h3>
                <p class="card-specs">Количество Ядер: {{ .Cores }} шт.</p>
                <p class="card-specs">Объём RAM: {{ .RAM }} ГБ</p>

                <div class="card-footer">
                  <div class="card-likes">
                    <img src="/static/img/blue-like.png" alt="Лайк" class="like-icon" />
                    <span class="likes-count">{{ .Likes }}</span>
                  </div>
                  <a href="/RenderServerUnits/{{ .ID }}" class="card-btn">Выбрать</a>
                </div>
              </div>
            </li>
            {{ end }}
          </ul>
        </div>
      </div>

      <div class="nav">
        <ul class="nav-list">
          <li>
            <a href="/RenderServerUnits/1">
              <img src="/static/img/home.png" alt="Лента" />
            </a>
          </li>
          <li>
            <a href="/AddRenderServerUnit">
              <img src="/static/img/add.png" alt="Добавление" />
            </a>
          </li>
          <li class="active">
            <a href="/RenderServerUnits">
              <img src="/static/img/grid.png" alt="Плитка" />
            </a>
          </li>
        </ul>
      </div>
    </div>

    <script>
      const minSlider = document.getElementById('range-min');
      const maxSlider = document.getElementById('range-max');
      const minOutput = document.getElementById('min-output');
      const maxOutput = document.getElementById('max-output');

      function updateSlider() {
        let minVal = parseInt(minSlider.value, 10);
        let maxVal = parseInt(maxSlider.value, 10);

        // Если min уехал вправо дальше max — возвращаем его на место
        if (minVal > maxVal) {
          minSlider.value = maxVal;
          minVal = maxVal;
        }
        // Если max уехал влево дальше min — возвращаем его на место
        if (maxVal < minVal) {
          maxSlider.value = minVal;
          maxVal = minVal;
        }

        // Обновляем надписи
        minOutput.textContent = minVal;
        maxOutput.textContent = maxVal;
      }

      // Слушаем оба ползунка
      minSlider.addEventListener('input', updateSlider);
      maxSlider.addEventListener('input', updateSlider);

      // Инициализация при загрузке страницы
      updateSlider();
    </script>
  </body>
</html>
